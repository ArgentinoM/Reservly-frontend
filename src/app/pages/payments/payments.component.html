@if (isLoading()) {
  <spiner/>
}

<section
  [class.hidden]="isLoading()"
  class="min-h-screen flex flex-col items-center justify-center gap-8 px-4
         bg-gradient-to-br from-background via-background to-secondary/40">

  <div class="w-full max-w-lg">
    <button
      (click)="goBack()"
      class="group inline-flex items-center gap-2
             px-4 py-2 rounded-full
             bg-secondary/70 backdrop-blur-md
             text-sm font-medium text-text-primary
             shadow-sm hover:shadow-md
             hover:bg-secondary transition-all cursor-pointer">

      <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
      <span>Regresar</span>
    </button>
  </div>


  <div
    id="payment-element"
    class="w-full max-w-lg
           rounded-3xl bg-secondary
           p-8 shadow-xl shadow-primary/10
           border border-white/5
           flex flex-col gap-6"></div>


  <div
    class="w-full max-w-lg
           rounded-2xl
           bg-background/70 backdrop-blur
           p-5 text-sm text-text-secondary
           border border-primary/20">

    <p class="mb-2 flex items-center gap-2 font-semibold text-text-primary">
      <i class="fa-solid fa-circle-info text-primary"></i>
      Tarjetas de prueba (Stripe)
    </p>

    <ul class="list-disc list-inside space-y-1 opacity-90">
      <li><b>4242 4242 4242 4242</b> → Pago aceptado</li>
      <li><b>4000 0000 0000 9995</b> → Fondos insuficientes</li>
      <li><b>4000 0000 0000 0002</b> → Tarjeta rechazada</li>
      <li>Fecha futura y CVV cualquiera</li>
    </ul>

  </div>


  <button
    type="button"
    (click)="pay()"
    class="w-full max-w-lg
           flex items-center justify-center gap-2
           rounded-xl py-3
           bg-primary text-white font-semibold
           shadow-lg shadow-primary/30
           hover:bg-primary/90 hover:shadow-xl
           active:scale-95 transition-all cursor-pointer">
    <i class="fa-solid fa-lock text-sm"></i>
    Pagar ahora
  </button>

</section>

@if (alertVisible()) {
<notifications-component [type]="alertType()"
  (close)="alertVisible.set(false)"
  [message]="alertMessage()" />
}
